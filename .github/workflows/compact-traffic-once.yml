name: Compact Traffico UI once

on:
  push:
    paths:
      - '.github/workflows/compact-traffic-once.yml'

permissions:
  contents: write

jobs:
  compact-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply compact layout directly to CSS
        shell: bash
        run: |
          cat >> ios27.css <<'EOF'

/* === COMPACT UI DIRECT FIX v4 ===
   Riduce realmente la hero "Scelta consigliata" e recupera spazio verticale. */
@media(max-width:759px){
  .app{padding:max(8px,env(safe-area-inset-top)) 9px max(14px,env(safe-area-inset-bottom))!important}
  .app:before{margin:0 4px 5px!important;font-size:7.5px!important}
  .header{padding:10px 11px!important;margin-bottom:7px!important;border-radius:20px!important}
  .header>div:first-child{padding-left:42px!important}
  .header>div:first-child:before{width:33px!important;height:33px!important;border-radius:10px!important;font-size:18px!important;top:1px!important}
  h1:before{font-size:24px!important;margin-bottom:2px!important}
  h1{font-size:12px!important;margin:1px 0 3px!important}
  .eyebrow,.meta{font-size:7.5px!important}
  .actions{gap:5px!important}
  .circle{width:36px!important;height:36px!important;border-radius:11px!important;font-size:15px!important}
  .directionSwitch{padding:4px!important;margin-bottom:7px!important;border-radius:16px!important;gap:4px!important}
  .directionBtn{min-height:36px!important;font-size:8.5px!important;padding:0 4px!important;border-radius:13px!important}

  .decision,
  .decision.a1,
  .decision.noa1,
  .decision.tie,
  .decision.loading{
    min-height:0!important;
    height:auto!important;
    padding:9px 11px!important;
    margin:0 0 7px!important;
    border-radius:19px!important;
  }
  .decisionTop{grid-template-columns:36px minmax(0,1fr) auto!important;gap:8px!important;align-items:center!important}
  .decisionIcon{width:36px!important;height:36px!important;border-radius:11px!important;font-size:18px!important}
  .decisionKicker{font-size:6px!important;letter-spacing:.13em!important}
  .decisionTitle{font-size:21px!important;line-height:.94!important;max-width:none!important;margin-top:1px!important;letter-spacing:-.04em!important}
  .decisionSub{font-size:8px!important;line-height:1.18!important;margin-top:3px!important;max-width:none!important}
  .live{position:relative!important;right:auto!important;top:auto!important;align-self:center!important;padding:4px 6px 4px 15px!important;font-size:6px!important}
  .live:before{left:6px!important;width:4px!important;height:4px!important;box-shadow:0 0 0 2px rgba(35,230,255,.10),0 0 8px var(--f-cyan)!important}

  .routes{gap:6px!important}
  .route{min-height:0!important;padding:10px 11px 9px!important;border-radius:19px!important}
  .route:after{left:11px!important;right:11px!important}
  .routeName{font-size:7.5px!important;gap:7px!important}
  .routeName:before{width:27px!important;height:27px!important;border-radius:9px!important;font-size:9px!important}
  #normalCard .routeName:before{font-size:16px!important}
  .routeMain{margin-top:7px!important;gap:7px!important}
  .routeTime{font-size:48px!important}
  .routeUnit{font-size:8px!important;margin:0 0 4px 4px!important}
  .routeEta{font-size:22px!important}
  .routeEta span{font-size:6px!important;margin-bottom:3px!important}
  .routeStatus{margin-top:7px!important;padding:5px 8px!important;font-size:7.5px!important}
  .routeStatus:before{width:5px!important;height:5px!important}
  .routeDetail{margin-top:4px!important;font-size:7.8px!important;line-height:1.22!important}
  .trafficBar{margin-top:5px!important;height:4px!important}
  .diff{margin-top:4px!important;font-size:8.5px!important}
}

@media(max-width:380px){
  .decisionTitle{font-size:20px!important}
  .decisionTop{grid-template-columns:34px minmax(0,1fr) auto!important;gap:7px!important}
  .decisionIcon{width:34px!important;height:34px!important;font-size:17px!important}
  .routeTime{font-size:45px!important}
  .routeEta{font-size:20px!important}
}

@media(min-width:760px){
  .decision{min-height:0!important;height:auto!important;align-self:start!important;padding:15px!important;border-radius:24px!important}
  .decisionTop{grid-template-columns:44px minmax(0,1fr) auto!important;gap:10px!important}
  .decisionIcon{width:44px!important;height:44px!important;border-radius:14px!important;font-size:21px!important}
  .decisionTitle{font-size:31px!important;line-height:.94!important}
  .decisionSub{margin-top:5px!important;font-size:9px!important;line-height:1.25!important}
  .route{min-height:0!important;padding:14px!important}
}
EOF

      - name: Force fresh CSS version
        shell: bash
        run: |
          sed -i 's/ios27\.css?v=3/ios27.css?v=4/g' index.html

      - name: Commit compact UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios27.css index.html
          git commit -m "Compact Traffico hero and optimize vertical spacing"
          git push origin main
