name: Compact Traffico UI once

on:
  push:
    paths:
      - '.github/workflows/compact-traffic-once.yml'

permissions:
  contents: write

jobs:
  compact-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append compact CSS overrides
        shell: bash
        run: |
          echo '' | base64 -d >> ios27.css
          sed -i 's/ios27\.css?v=3/ios27.css?v=4/g' index.html
      - name: Commit compact UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios27.css index.html
          git commit -m "Compact Traffico hero and optimize vertical spacing"
          git push origin main
