name: Bump Traffic UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bump-traffic-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cache version
        run: python3 patch_cache_once.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Force Traffic UI v3 on iPhone"
          git push
